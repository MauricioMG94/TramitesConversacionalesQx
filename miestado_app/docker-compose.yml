services:
  # ── Base de Datos ──
  mongo:
    image: mongo:7
    container_name: miestado_mongo
    restart: unless-stopped
    networks:
      - miestado_net
    ports:
      - "${MONGO_EXTERNAL_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-miestado}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # ── Backend API (FastAPI) ──
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: miestado-app:latest
    container_name: miestado_app_api
    restart: unless-stopped
    networks:
      - miestado_net
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - APP__ENV=${APP__ENV:-dev}
      - API_HOST=0.0.0.0
      - API_PORT=8888
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
      - MONGO_DB=${MONGO_DB:-miestado}
      - MONGO_URI=mongodb://mongo:27017
      - SECRET_KEY=${SECRET_KEY:-please-change-me-please-change-me}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      # Origenes CORS: se arman aqui con interpolacion de Compose para
      # garantizar que ${DOMAIN} SI se expanda a 'miestadoapp.online'.
      # Si lo hicieras en .env, Docker pasaria el literal '${DOMAIN}'
      # sin expandir y el navegador nunca haria match.
      # En produccion, agrega dominios extras separados por coma.
      - CORS_ORIGINS=https://${DOMAIN},http://localhost:5173,http://localhost:3000,http://localhost:8888
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SEED_ADMIN_ENABLED=${SEED_ADMIN_ENABLED:-true}
      - SEED_ADMIN_CORREO=${SEED_ADMIN_CORREO:-admin@miestado.local}
      - SEED_ADMIN_NOMBRE=${SEED_ADMIN_NOMBRE:-Administrador}
      - SEED_ADMIN_CONTRASENA=${SEED_ADMIN_CONTRASENA:-CambiarEnProduccion123*}
      - SEED_ADMIN_ROL=${SEED_ADMIN_ROL:-admin}
      # RUNT (integracion con el Registro Unico Nacional de Transito).
      - RUNT_ENABLED=${RUNT_ENABLED:-true}
      - RUNT_MODE=${RUNT_MODE:-mock}
      - RUNT_BASE_URL=${RUNT_BASE_URL:-https://pruebas-api.runt.example.gov.co}
      - RUNT_TIMEOUT_SECONDS=${RUNT_TIMEOUT_SECONDS:-15}
      - RUNT_CLIENT_ID=${RUNT_CLIENT_ID:-}
      - RUNT_CLIENT_SECRET=${RUNT_CLIENT_SECRET:-}
      - RUNT_MTLS_ENABLED=${RUNT_MTLS_ENABLED:-false}
      - RUNT_CERT_PATH=${RUNT_CERT_PATH:-/secrets/runt/client.crt}
      - RUNT_KEY_PATH=${RUNT_KEY_PATH:-/secrets/runt/client.key}
      - RUNT_CA_PATH=${RUNT_CA_PATH:-/secrets/runt/ca.pem}
      # Chat conversacional (RUNT + intenciones del bot).
      - CHAT_ENABLED=${CHAT_ENABLED:-true}
      - CHAT_PERSIST_CONVERSACIONES=${CHAT_PERSIST_CONVERSACIONES:-true}
      - CHAT_MAX_HISTORIAL=${CHAT_MAX_HISTORIAL:-10}
      - CHAT_DEBUG_VEHICULO=${CHAT_DEBUG_VEHICULO:-false}
    expose:
      - "8888"
    ports:
      - "${API_EXTERNAL_PORT:-8888}:8888"
    # Monta los certificados mTLS de RUNT si existen en el host.
    # Si no existe el directorio ./secrets/runt, Docker no falla al levantar;
    # el cliente RUNT validara las rutas y devolvera 503 si no encuentra los
    # archivos al activarse RUNT_MTLS_ENABLED=true.
    volumes:
      - ./secrets/runt:/secrets/runt:ro

  # ── Frontend (React + Vite construido, servido por nginx) ──
  # El contexto de build es la RAIZ del workspace para que pnpm pueda
  # resolver el monorepo. El Dockerfile vive en artifacts/miestado/.
  frontend:
    build:
      context: ..
      dockerfile: artifacts/miestado/Dockerfile
      args:
        # En produccion VITE_API_BASE debe quedar VACIO. App.tsx concatena
        # `${API_BASE}/api/auth/token`, etc.; si exportamos /api aqui
        # termina llamando `/api/api/auth/token` y el backend 404ea.
        # Solo se usa no-vacio cuando el frontend se sirve sin nginx
        # delante (dev local con Vite dev-server en otro origen); ahi se
        # pone la URL absoluta del backend, p.ej. http://localhost:8888.
        VITE_API_BASE: ${VITE_API_BASE:-}
    image: miestado-frontend:latest
    container_name: miestado_app_frontend
    restart: unless-stopped
    networks:
      - miestado_net
    depends_on:
      - api
    expose:
      - "3000"
    ports:
      - "${FRONTEND_EXTERNAL_PORT:-5173}:3000"

  # ── Gateway dedicado (Caddy) ──
  # Reverse proxy con HTTPS automatico (Let's Encrypt via HTTP-01, sin
  # necesidad de configurar dns-01 ni volumenes compartidos).
  # Solo escucha 80/443 para el dominio configurado en DOMAIN. Caddy
  # escribe los challenge tokens INTERNAMENTE y los sirve al path
  # /.well-known/acme-challenge/ correctamente sin tener que montar
  # directorios ni coordinar con jwilder/nginx-proxy.
  gateway:
    image: caddy:2-alpine
    container_name: miestado_gateway
    restart: unless-stopped
    networks:
      - miestado_net
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN}

volumes:
  mongo_data:
  caddy_data:
  caddy_config:

networks:
  miestado_net:
    driver: bridge
