services:
  # ── Base de Datos ──
  mongo:
    image: mongo:7
    container_name: miestado_mongo
    restart: unless-stopped
    networks:
      - miestado_net
    ports:
      - "${MONGO_EXTERNAL_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-miestado}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # ── Backend API (FastAPI) ──
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: miestado-app:latest
    container_name: miestado_app_api
    restart: unless-stopped
    networks:
      - miestado_net
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - APP__ENV=${APP__ENV:-dev}
      - API_HOST=0.0.0.0
      - API_PORT=8888
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
      - MONGO_DB=${MONGO_DB:-miestado}
      - MONGO_URI=mongodb://mongo:27017
      - SECRET_KEY=${SECRET_KEY:-please-change-me-please-change-me}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      # Origenes CORS: se arman aqui con interpolacion de Compose para
      # garantizar que ${DOMAIN} SI se expanda a 'miestadoapp.online'.
      # Si lo hicieras en .env, Docker pasaria el literal '${DOMAIN}'
      # sin expandir y el navegador nunca haria match.
      # En produccion, agrega dominios extras separados por coma.
      - CORS_ORIGINS=https://${DOMAIN},http://localhost:5173,http://localhost:3000,http://localhost:8888
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SEED_ADMIN_ENABLED=${SEED_ADMIN_ENABLED:-true}
      - SEED_ADMIN_CORREO=${SEED_ADMIN_CORREO:-admin@miestado.local}
      - SEED_ADMIN_NOMBRE=${SEED_ADMIN_NOMBRE:-Administrador}
      - SEED_ADMIN_CONTRASENA=${SEED_ADMIN_CONTRASENA:-CambiarEnProduccion123*}
      - SEED_ADMIN_ROL=${SEED_ADMIN_ROL:-admin}
    expose:
      - "8888"
    ports:
      - "${API_EXTERNAL_PORT:-8888}:8888"

  # ── Frontend (React + Vite construido, servido por nginx) ──
  # El contexto de build es la RAIZ del workspace para que pnpm pueda
  # resolver el monorepo. El Dockerfile vive en artifacts/miestado/.
  frontend:
    build:
      context: ..
      dockerfile: artifacts/miestado/Dockerfile
      args:
        # Ruta RELATIVA al backend Express (mismo origen que el frontend).
        # El nginx interno del contenedor hace proxy_pass /api/ -> http://api:8888.
        # En piloto local, dejar el default (/api). Para usar un dominio
        # externo con CORS separado, exportar VITE_API_BASE=https://api.example.com.
        VITE_API_BASE: ${VITE_API_BASE:-/api}
    image: miestado-frontend:latest
    container_name: miestado_app_frontend
    restart: unless-stopped
    networks:
      - miestado_net
    depends_on:
      - api
    expose:
      - "3000"
    environment:
      - VIRTUAL_HOST=${DOMAIN}
      - VIRTUAL_PORT=3000
      - LETSENCRYPT_HOST=${DOMAIN}
      - LETSENCRYPT_EMAIL=${LETSENCRYPT_EMAIL:-admin@${DOMAIN}}
    # HTTPS via nginx-proxy si existe la red externa (configurable con
    # PROXY_NETWORK en .env). Se deja como comentario porque cuando la
    # red no existe, el `up` falla; ver miestado_app/Caddyfile para un
    # gateway dedicado si no queres depender del contenedor compartido.
    # networks:
    #   - nginx-proxy
    ports:
      - "${FRONTEND_EXTERNAL_PORT:-5173}:3000"

volumes:
  mongo_data:

networks:
  miestado_net:
    driver: bridge
  # Red EXTERNA opcional para compartir nginx-proxy entre proyectos en
  # el VPS. Se declara como external; si no existe (porque todavia no
  # instalaste el nginx-proxy), docker-compose no rompe: solo no se
  # hace nada y el frontend queda accesible solo por mapeo de host
  # (5173 -> 3000, util para dev local).
  nginx-proxy:
    external: true
    name: ${PROXY_NETWORK:-nginx-proxy_default}
    optional: true
