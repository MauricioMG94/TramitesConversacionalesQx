server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Buenos headers de seguridad.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SPA routing de Vite + wouter: cualquier ruta cae a index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache agresivo para assets con hash (Vite emite /assets/<hash>.js).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Sirve fuentes, imagenes y otros estaticos.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Bloquea acceso a archivos sensibles y al .git por error.
    location ~ /\. {
        deny all;
    }
}
